<div class="container">
  <h2 class="text-center" style="background-color: blue;border-radius: 12px;color: aliceblue;padding: 12px;">TMDB MOVIES</h2>
  <div class="row">

    <div class="col-md-4 mb-4" *ngFor="let movie of movies">

      <app-movie-card [movie]="movie" (emitMovie)="getMsgFromChild($event)">
      </app-movie-card>

    </div>

  </div>
</div>
