<div class="container mt-4">

  <h2 class="tmdb-heading text-center mb-4">
    🎬 TMDB MOVIE COLLECTION
  </h2>

  <div class="row">

    <!-- 4 Cards Per Row -->
    <div
      class="col-md-4 mb-4"
      *ngFor="let movie of movies"
    >

      <app-movie-card
        [movie]="movie"
        (emitMovie)="getMsgFromChild($event)">
      </app-movie-card>

    </div>

  </div></div>
