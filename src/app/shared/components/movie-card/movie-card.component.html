<div class="container mt-5">
  <div class="row">


      <div class="movie-card">

        <!-- Movie Poster -->
        <div class="poster">
          <img 
            [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path"
            alt="movie image"
          />
        </div>

        <!-- Movie Details -->
        <div class="movie-info">

          <!-- Title -->
          <h5>
            {{ movie.title ? movie.title : movie.original_title }}
          </h5>

          <!-- Release Date -->
          <p class="date">
            📅 {{ movie.release_date }}
          </p>

          <!-- Rating -->
          <p class="rating">
            ⭐ {{ movie.vote_average }}
          </p>

          <!-- Overview -->
          <p class="overview">
            {{ movie.overview | slice:0:100 }}...
          </p>

          <!-- Adult Badge -->
          <span 
            class="badge"
            [class.adult]="movie.adult"
            [class.family]="!movie.adult"
          >
            {{ movie.adult ? '18+' : 'Family' }}
          </span>

        </div>

      </div>
    </div>
</div>
